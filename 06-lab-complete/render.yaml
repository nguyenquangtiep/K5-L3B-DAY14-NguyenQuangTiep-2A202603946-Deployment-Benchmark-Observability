services:
  - type: web
    name: day14-production-agent
    runtime: docker
    plan: free
    region: singapore

    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: AGENT_API_KEY
        generateValue: true

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

      - key: RATE_LIMIT_PER_MINUTE
        value: "10"

      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction